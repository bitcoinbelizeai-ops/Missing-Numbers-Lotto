<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#094692">
<title>Page not found · Missing Numbers</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Barlow:wght@400;600;700&display=swap">
<style>
:root{--felt:#144fa6;--felt-deep:#0a3a80;--felt-hi:#1f67c9;--gold:#ffd659;--cream:#f7f0dc;--muted:#f1f5fc;--line:rgba(255,255,255,.30);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;font:17px/1.6 Barlow,system-ui,sans-serif;color:var(--cream);text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,var(--felt-hi) 0%,var(--felt) 45%,var(--felt-deep) 100%) fixed,var(--felt-deep);padding:24px 16px}
main{max-width:420px}
.ball{width:120px;height:120px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 25%,#fff0b8 0%,#f6cd5c 45%,#a97a22 100%);box-shadow:0 10px 24px rgba(0,0,0,.45)}
.ball span{width:64%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 34px Outfit,Barlow,sans-serif;color:#13306b}
h1{font:800 28px/1.15 Outfit,Barlow,sans-serif;color:var(--gold);margin:0 0 6px;text-wrap:balance}
p{margin:0 0 22px;color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:48px;padding:10px 22px;border-radius:999px;font-weight:700;text-decoration:none;color:#2a1d00;
  background:linear-gradient(180deg,#fff0b8,#f6cd5c 45%,#a97a22);border:1px solid #f6cd5c}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="ball" aria-hidden="true"><span>404</span></div>
  <h1>Weh Play? Not this page!</h1>
  <p>We couldn't find that page. The latest results are one tap away.</p>
  <a href="/">Go to Missing Numbers</a>
</main>
</body>
</html>
