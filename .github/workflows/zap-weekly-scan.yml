# Weekly website safety scan of the preview site with OWASP ZAP (baseline = look only, no attacks).
# Results: an issue titled "ZAP weekly scan: preview site" in the Issues tab, updated each week,
# plus a downloadable report on the Actions run page. Run it any time from Actions > ZAP weekly scan > Run workflow.
name: ZAP weekly scan

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC = 7:00 am Belize
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # lets the scan open/update its report issue

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan the preview site
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0, pinned to its exact version
        with:
          target: "https://bitcoinbelizeai-ops.github.io/Missing-Numbers-Lotto/preview/"
          issue_title: "ZAP weekly scan: preview site"
          fail_action: false
          allow_issue_writing: true
