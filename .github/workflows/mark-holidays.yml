name: Mark public holidays

# Saves "no draw" markers in draws.json for public holidays (scripts/mark_holidays.py),
# so the app and the Admin page stop waiting for a result. Replaces the old backup
# results job ("Update Belize results"), removed 27 Nov 2026 when that API account was cancelled.

on:
  schedule:
    # Times are UTC. Belize is UTC-6 all year. 9:15 pm Belize Mon-Sat (after the last draw),
    # and 6:23 am Belize every day as a catch-up. GitHub can start runs 5-20 minutes late.
    - cron: "15 3 * * 0,2-6"
    - cron: "23 12 * * *"
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: results-write   # shared with the BBN job, so the two never write draws.json at the same time
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to its exact version

      - name: Mark public holidays
        run: python3 scripts/mark_holidays.py

      - name: Save
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Public holiday: no draw $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet || true
            git push
          fi
