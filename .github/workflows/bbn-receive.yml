# Receives one result read from a BBN Belize Facebook post (sent by Make.com).
# MAIN SOURCE since Nov 20, 2026: saves it to data/bbn-results.json and, if it passes the
# safety rules in scripts/receive_bbn.py, adds it to draws.json (the site) at once.
# Manual "Run workflow" tests are saved but never added to the site.
# Since Nov 25, 2026 the same job also takes Love FM text posts (Boledo only): client_payload {"source":"lovefm","text_b64":...}.
# Paste this file into GitHub at .github/workflows/bbn-receive.yml
name: Receive BBN result

on:
  repository_dispatch:
    types: [bbn-result]
  workflow_dispatch:
    inputs:
      answer:
        description: 'Test: paste an answer, e.g. {"is_result":true,"game":"pick3","date":"2026-11-16","nums":["0","9","0"],"letter":null,"readable":true,"notes":""}'
        required: true

permissions:
  contents: write

concurrency:
  group: results-write   # shared with the public holiday job, so the two never write draws.json at the same time
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned to its exact version

      - name: Check the result, add it to the site if it passes, and save
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          TEST_ANSWER: ${{ github.event.inputs.answer }}
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # name the source in the commit message: "Love FM result ..." or "BBN result ..."
          src=$(python3 -c 'import json,os; p=json.loads(os.environ.get("PAYLOAD_JSON") or "null") or {}; print("Love FM" if str(p.get("source","")).strip().lower()=="lovefm" else "BBN")' 2>/dev/null || echo BBN)
          for i in 1 2 3; do
            python3 scripts/receive_bbn.py
            # game pages (/boledo/ etc.) carry the latest result in their HTML for Google: rebuild them too
            python3 scripts/build_game_pages.py || echo "Game pages not rebuilt (the result is still saved)."
            git add data/bbn-results.json draws.json boledo fantasy-5 pick-3 sunday-jackpot 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Nothing new to save."
              exit 0
            fi
            if git diff --cached --quiet -- draws.json; then msg="$src result (saved, not added)"; else msg="$src result added to the site"; fi
            git commit -q -m "$msg"
            git push -q && exit 0
            # Someone else saved first (e.g. the Admin page): start again from the newest files
            echo "Push refused, trying again with the newest files ($i)"
            sleep 5
            git fetch -q origin main && git reset -q --hard origin/main
          done
          echo "Could not save after 3 tries."
          exit 1

      - name: Send draw alerts
        # One alert per new draw to phones that tapped the bell (scripts/send_alerts.py).
        # Never fails this job; does nothing until the two secrets are added.
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SENDER_TOKEN: ${{ secrets.PUSH_SENDER_TOKEN }}
        run: |
          if [ -z "$PUSH_SENDER_TOKEN" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then echo "Draw alerts: secrets not set yet."; exit 0; fi
          python3 -m venv /tmp/alerts && /tmp/alerts/bin/pip install --quiet --disable-pip-version-check pywebpush==2.0.3
          git pull --quiet --ff-only || true   # newest draws.json
          /tmp/alerts/bin/python scripts/send_alerts.py
