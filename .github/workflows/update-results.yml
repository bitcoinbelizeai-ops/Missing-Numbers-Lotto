name: Update Belize results

on:
  schedule:
    # Times are UTC. Belize is UTC-6 all year (no daylight saving).
    # Each game is asked for about 20 minutes after its draw (READY_HOURS below is 15 minutes).
    # If magayo hasn't posted it yet, a later run tries again, but only while there are enough
    # calls left for every draw still to come this period. Runs with nothing missing make no calls.
    # GitHub can start scheduled runs 5-20 minutes late.
    #
    # Fantasy 5 (Tue/Thu/Sat 8:00 pm): 8:20 pm Belize
    - cron: "20 2 * * 0,3,5"
    # Pick 3 (Mon-Fri 8:30 pm): 8:50 pm Belize
    - cron: "50 2 * * 2-6"
    # Boledo (Mon-Fri 9:00 pm): 9:30 pm Belize
    - cron: "30 3 * * 2-6"
    # Late sweep for anything not posted yet: 10:25 pm Belize (Mon-Sat)
    - cron: "25 4 * * 0,2-6"
    # Sunday Jackpot (Sun 10:00 am, finished about 10:30 am): 11:00 am Belize,
    # then 11:45 am and 2:23 pm Sun and Mon (Monday in case it was postponed)
    - cron: "0 17 * * 0"
    - cron: "45 17 * * 0,1"
    - cron: "23 20 * * 0,1"
    # Morning safety net: 6:23 am Belize (Tue-Sun)
    - cron: "23 12 * * 0,2-6"
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
    inputs:
      lookback_days:
        description: "How many days back to fill gaps (14 normally; up to 60 for a one-time catch-up). The safeguards still apply."
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned to its exact version

      - name: Fetch missing results from magayo
        env:
          MAGAYO_API_KEY: ${{ secrets.MAGAYO_API_KEY }}
          MONTHLY_API_LIMIT: ${{ vars.MONTHLY_API_LIMIT }}   # 100 on Bronze
          SAFETY_RESERVE: ${{ vars.SAFETY_RESERVE || '1' }}  # keep 1 spare: stops at 99 of 100
          MAX_CALLS_PER_RUN: ${{ vars.MAX_CALLS_PER_RUN }}   # optional, default 10
          API_RESET_DAY: ${{ vars.API_RESET_DAY }}           # optional, default 1
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          READY_HOURS: '0.25'                                # ask magayo 15 minutes after each draw
        run: python3 scripts/update_results.py

      - name: Save the new results
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json data/api-usage.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update Belize results $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet || true   # in case files were uploaded while it ran
            git push
          fi
