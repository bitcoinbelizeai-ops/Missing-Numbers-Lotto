name: Update Belize results

on:
  schedule:
    # Times are UTC. Belize is UTC-6 all year (no daylight saving).
    # Since Nov 20, 2026 BBN (receive_bbn.py) is the main source and adds results within minutes.
    # magayo is the BACKUP: a run only calls magayo for draws BBN hasn't delivered, first
    # 45 minutes after the draw (FIRST_TRY_MINUTES), then about every hour, 3 times in the
    # evening, plus one last try in the morning. Runs with nothing missing make no calls.
    # GitHub can start scheduled runs 5-20 minutes late.
    #
    # Evenings Mon-Sat, every 30 minutes, 8:45 pm to 11:45 pm Belize
    # (Fantasy 5 8:00 pm -> first try 8:45; Pick 3 8:30 pm -> 9:15; Boledo 9:00 pm -> 9:45)
    - cron: "45 2 * * 0,2-6"
    - cron: "15,45 3-5 * * 0,2-6"
    # Sunday Jackpot (Sun 10:00 am, finished about 10:30 am): 11:15 am, 12:15 pm and 2:23 pm Sun,
    # and 11:45 am + 2:23 pm Mon in case it was postponed
    - cron: "15 17,18 * * 0"
    - cron: "45 17 * * 1"
    - cron: "23 20 * * 0,1"
    # Morning, every day 6:23 am Belize: last try for anything still missing, and the
    # double-check of last night's BBN results (data/magayo-checks.json)
    - cron: "23 12 * * *"
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
    inputs:
      lookback_days:
        description: "How many days back to fill gaps (14 normally; up to 60 for a one-time catch-up). The safeguards still apply."
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: results-write   # shared with the BBN job, so the two never write draws.json at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned to its exact version

      - name: Fetch missing results from magayo
        env:
          MAGAYO_API_KEY: ${{ secrets.MAGAYO_API_KEY }}
          MONTHLY_API_LIMIT: ${{ vars.MONTHLY_API_LIMIT }}   # 100 on Bronze
          SAFETY_RESERVE: ${{ vars.SAFETY_RESERVE || '1' }}  # keep 1 spare: stops at 99 of 100
          MAX_CALLS_PER_RUN: ${{ vars.MAX_CALLS_PER_RUN }}   # optional, default 10
          API_RESET_DAY: ${{ vars.API_RESET_DAY }}           # optional, default 1
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          FIRST_TRY_MINUTES: '45'                            # magayo is the backup: give BBN 45 minutes first
        run: python3 scripts/update_results.py

      - name: Save the new results
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json data/api-usage.json
          git add data/magayo-checks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update Belize results $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet || true   # in case files were uploaded while it ran
            git push
          fi
