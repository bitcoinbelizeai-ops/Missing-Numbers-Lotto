name: Update Belize results

on:
  schedule:
    # Times are UTC. Belize is UTC-6 all year (no daylight saving).
    # Draws (Belize time): Fantasy 5 Tue/Thu/Sat 8:00 pm, Pick 3 Mon-Fri 8:30 pm,
    # Boledo Mon-Fri 9:10 pm, Sunday Jackpot Sun 10:00 am.
    # A draw is only asked for once it is at least READY_HOURS old (set below), and a run
    # with nothing missing makes no API calls, so the extra runs cost nothing.
    #
    # Same night, 9:40 pm Belize (Mon-Sat): Fantasy 5 (1 h 40 after) and Pick 3 (1 h 10 after).
    - cron: "40 3 * * 0,2-6"
    # Same night, 10:25 pm Belize (Mon-Fri): Boledo (1 h 15 after).
    - cron: "25 4 * * 2-6"
    # Sunday Jackpot: 11:20 am Belize on Sunday (1 h 20 after); Monday too in case it was postponed.
    - cron: "20 17 * * 0,1"
    # Safety net, 6:23 am Belize (Tue-Sun): anything magayo hadn't posted yet the night before.
    - cron: "23 12 * * 0,2-6"
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab
    inputs:
      lookback_days:
        description: "How many days back to fill gaps (14 normally; up to 60 for a one-time catch-up). The safeguards still apply."
        required: false
        default: "14"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - name: Fetch missing results from magayo
        env:
          MAGAYO_API_KEY: ${{ secrets.MAGAYO_API_KEY }}
          MONTHLY_API_LIMIT: ${{ vars.MONTHLY_API_LIMIT }}   # 100 on Bronze
          SAFETY_RESERVE: ${{ vars.SAFETY_RESERVE }}         # optional, default 5 spare
          MAX_CALLS_PER_RUN: ${{ vars.MAX_CALLS_PER_RUN }}   # optional, default 10
          API_RESET_DAY: ${{ vars.API_RESET_DAY }}           # optional, default 1
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
          READY_HOURS: '1'                                   # ask magayo 1 hour after each draw
        run: python3 scripts/update_results.py

      - name: Save the new results
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json data/api-usage.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update Belize results $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet || true   # in case files were uploaded while it ran
            git push
          fi
